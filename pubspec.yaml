name: slovo_startsa
description: "Слово старца — короткое высказывание православных старцев на каждый день."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.0
  path: ^1.9.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/quotes.json
  fonts:
    - family: OldStandard
      fonts:
        - asset: assets/fonts/OldStandard-Regular.ttf
        - asset: assets/fonts/OldStandard-Bold.ttf
          weight: 700
        - asset: assets/fonts/OldStandard-Italic.ttf
          style: italic
    - family: PTSerif
      fonts:
        - asset: assets/fonts/PT_Serif-Web-Regular.ttf
        - asset: assets/fonts/PT_Serif-Web-Bold.ttf
          weight: 700
        - asset: assets/fonts/PT_Serif-Web-Italic.ttf
          style: italic
